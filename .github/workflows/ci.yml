name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit + integration tests (workflow engine, e2e, PO/S/4 mock, mail, AI guard)
        run: npm test
      - name: Production build (HANA artefacts + precompiled OData)
        run: npx cds build --production
